name: Deploy Backend to Azure App Service

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore DSGRDMS.Server/DSGRDMS.Server.csproj

      - name: Publish
        run: dotnet publish DSGRDMS.Server/DSGRDMS.Server.csproj --configuration Release --output ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_76946793A8104CC49B351EDD1F93B78D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D91696E83B1C49B7907C82AAB5F1ABA7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3394588F18B04B87A60E661DB030440B }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: DSGRDMSServer20261011193044
          package: ./publish
